# Project paths for cardiomics_s2f (template).
#
# Copy to config/paths.yaml (gitignored) and adapt to your machine:
#     cp config/paths.example.yaml config/paths.yaml
# Python: cardiomics_s2f.config.load_paths()  |  workflows: cs2f_path <key>
#
# Rules:
#   - data_root: relative values resolve against this file's folder (config/).
#   - all other entries: relative values resolve against data_root.
#   - "~" and environment variables (e.g. $SCRATCH, $TMPDIR) are expanded.
#
# The defaults below match the repository layout (input_data/, models/, results/),
# so they work unchanged if the data is placed or symlinked there.

data_root: ..

# --- Inputs -------------------------------------------------------------------
# Pseudobulk BAMs (one <cell type>.bam per pseudobulk) and Cut&Tag BAMs
atac_bam_dir: input_data/raw_bam/multiome_ATAC
rna_bam_dir: input_data/raw_bam/multiome_RNA
# Folder with .bam files, or a text file listing BAM paths (one per line)
cutntag_bam_input: input_data/raw_bam/CutnTag
bigwig_dir: input_data/AlphaGenome_Borzoi_input
intervals_dir: input_data/AlphaGenome_Borzoi_input/intervals
chrombpnet_input_dir: input_data/chrombpnet_input
variant_data_dir: input_data/variant_data
# Default VEP input (CSV with variant_id, CHROM, POS, REF, ALT)
vep_input_vcf: input_data/variant_data/variants.csv
nonzero_means_csv: input_data/metadata/bw_nonzero_means.csv
# Pseudobulk ATAC peaks (MACS2 *_peaks.narrowPeak, one file per cell type)
atac_peak_dir: input_data/atac_peaks
# ABC-model candidate enhancers of the cardioids (TSV with seqnames, start, end, samples, ...)
abc_enhancer_table: input_data/variant_data/summarized.table.variants.with_multiome_abc.tsv
# Motif database for seqlet annotation (MEME format, e.g. HOCOMOCO v14 core)
motif_meme_file: input_data/metadata/HOCOMOCO_H14_CORE.meme.txt

# --- Reference genome (GRCh38, GENCODE release 29) ----------------------------
genome_fasta: input_data/metadata/GRCh38_gencode_release29_genome_fasta/genome.fa
chrom_sizes: input_data/metadata/GRCh38_gencode_release29_genome_fasta/genome.chrom.sizes
gtf: input_data/metadata/GRCh38_gencode_release29_genome_fasta/genes.gtf

# --- AlphaGenome fine-tuning --------------------------------------------------
# Targets config written by step 01 and read by steps 02-04
ag_targets_config: models/AlphaGenome_finetuned/targets_config.yaml
# Where step 02 writes checkpoints (resumed runs: <ag_ft_train_dir>_resumed)
ag_ft_train_dir: models/AlphaGenome_finetuned/heads
# Checkpoint evaluated by steps 03 (test eval) and 04 (VEP); its 'best' subfolder is used
ag_ft_checkpoint_dir: models/AlphaGenome_finetuned/heads
# Persistent XLA autotune cache (speeds up start-up of GPU jobs)
xla_cache_dir: models/xla_cache

# --- Models -------------------------------------------------------------------
models_dir: models

# --- Outputs ------------------------------------------------------------------
results_dir: results
model_eval_dir: results/model_evaluation
vep_dir: results/VEP
# Outputs of the AlphaGenome track-matching scripts (RNA/ and ATAC/ subfolders)
track_matching_dir: results/AG_track_matching
# DeepSHAP attributions of the fine-tuned AlphaGenome model (.npy)
attribution_dir: results/attribution_analysis
# Figures of the analysis notebooks (saving is commented out by default)
figures_dir: results/figures

# --- Logs & compute-node scratch ------------------------------------------------
# SLURM logs and run lists, one subfolder per workflow (logs/<workflow>/)
logs_dir: logs
# Node-local SSD for staging BigWigs (a per-job subfolder is created)
node_tmp_dir: /tmp
