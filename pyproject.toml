[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiomics-s2f"
version = "0.1.0"
description = "Sequence-to-function modelling (AlphaGenome, Borzoi, ChromBPNet) of cardioid multiomics data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jakob Then" }]
license = "MIT"
license-files = ["LICENSE"]
# Versions are intentionally unpinned for now; reproducible environments
# will be provided as lock files (see PACKAGE_MIGRATION_PLAN.md, backlog).
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "h5py",
    "pyBigWig",
    "pyranges",
    "ncls",
    "pyyaml",
    "python-dotenv",
    "requests",
    "tqdm",
]

[project.optional-dependencies]
# Required by cardiomics_s2f.io.data_input and cardiomics_s2f.eval.streamed_correlation_analysis
torch = ["torch"]
# Pretrained AlphaGenome API (cardiomics_s2f.ism)
alphagenome = ["alphagenome", "anndata"]
# AlphaGenome fine-tuning, test evaluation and fine-tuned VEP.
# alphagenome-ft is pinned: finetuning.alphagenome.training copies its training loop
# and uses private attributes of that version.
alphagenome-ft = [
    "alphagenome",
    "alphagenome-ft==0.1.5",
    "alphagenome-research",
    "jax",
    "torch",
    "anndata",
]
# Borzoi fine-tuning and VEP (finetuning.borzoi, vep.borzoi, workflows/borzoi/).
# grelu is pinned: finetuning.borzoi.datasets subclasses its LabeledSeqDataset and
# replaces the patched LazyBigWigDataset2 of that version.
borzoi = [
    "grelu==1.0.10",
    "einops",
    "psutil",
    "torch",
    "genomepy",
]
# ChromBPNet training and VEP (workflows/chrombpnet/, vep.chrombpnet); also used by
# workflows/input_prep. chrombpnet 0.1.7 pins TensorFlow 2.8 (CUDA 11); bedtools,
# samtools and the UCSC tools come from conda. variant-scorer is a pinned git checkout
# (workflows/chrombpnet/install_variant_scorer.sh), not a pip package.
chrombpnet = [
    "chrombpnet==0.1.7",
    "pysam",
]
# Analysis notebooks (analysis_notebooks/) and the modules they use:
# vep.cohort_plotting, eval.track_matching, finetuning.alphagenome.attributions
analysis = [
    "statsmodels",
    "adjustText",
    "matplotlib-venn",
    "tangermeme",
    "logomaker",
    "pyfaidx",
    "openpyxl",
    "pyarrow",
    "anndata",
    "torch",
    "jupyter",
]
# Keep in sync with docs/requirements.txt (used by Read the Docs)
docs = [
    "sphinx==9.1.0",
    "sphinx-argparse==0.5.2",
    "pydata-sphinx-theme==0.16.1",
    "sphinx-book-theme==1.2.0",
    "myst-nb",
]
dev = ["pytest", "pre-commit"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cardiomics_s2f*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
